 if(b<3)fb.push(`หลักฐาน: กรอกแถวที่มี ชื่อ เงื่อนไข ข้อมูล ให้ครบอย่างน้อย ${d.need} แถว (ตอนนี้ ${full})`);
 const ans=s.ans.trim(),hit=d.kw.filter(k=>ans.includes(k)).length;
 c=(ans.length>=40?1:0)+(hit>=2?1:0)+(s.rows.some(r=>r.concl.trim())?1:0);
 if(c<3)fb.push('การวิเคราะห์: ตอบอย่างน้อย 40 ตัวอักษร ใช้คำสำคัญจากข้อมูล และเขียนข้อสรุปในตารางอย่างน้อย 1 แถว');
 e=(s.aiCopied?1:0)+(s.aiv.trim().length>=10?1:0);
 if(e<2)fb.push('AI: คัดลอกพรอมต์ไปใช้ และเขียนว่าตรวจคำตอบ AI กับหลักฐานอย่างไร');
 return {t:a+b+c+e,fb};
}
function total(){return S.st.reduce((x,s,i)=>x+(S.on[i]&&s.checked?calc(i).t:0),0)}
function max(){return S.on.filter(Boolean).length*10}
function pass(){return Math.ceil(max()*0.8)}

function top(){
 const t=$('#top');if(!S.team){t.hidden=true;return}
 const done=S.st.filter((s,i)=>S.on[i]&&s.checked&&calc(i).t>=8).length,n=S.on.filter(Boolean).length;
 t.hidden=false;
 t.innerHTML=`<div class="fl" style="justify-content:space-between"><b class="disp">🚀 ${esc(S.team)}</b><b>⭐ ${total()} / ${max()}</b></div><div class="bar" style="margin-top:6px"><i style="width:${n?done/n*100:0}%"></i></div>`;
}
function go(h){$('#app').innerHTML=h;window.scrollTo(0,0);top()}

function home(){
 go(`<div class="card hero"><div class="icons">⚖️🪢📐🛞🔩🔪</div>
 <h1 class="title">SIMPLE MACHINES<br>MISSION</h1><p class="disp" style="font-size:1.2rem">ภารกิจพิชิต 6 เครื่องกล</p>
 <p>วิทยาศาสตร์ ม.2 · ทดลอง บันทึกหลักฐาน และใช้ AI อย่างมีวิจารณญาณ</p></div>
 <div class="card"><label>ชื่อทีม</label><input id="tm" maxlength="30" value="${esc(S.team)}" placeholder="เช่น ทีมนักประดิษฐ์">
 <label>สมาชิก (คั่นด้วยจุลภาค)</label><input id="mb" maxlength="120" value="${esc(S.members)}" placeholder="ชื่อ 1, ชื่อ 2, ชื่อ 3">
 <label>ฐานที่ใช้ในคาบนี้ (ครูปรับได้)</label><div class="fl">${ST.map((d,i)=>`<label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:22px;min-height:22px" ${S.on[i]?'checked':''} onchange="S.on[${i}]=this.checked?1:0">${d.e} ${i+1}</label>`).join('')}</div>
 <p id="er" class="no"></p><button class="btn g" style="width:100%;margin-top:8px" onclick="begin()">🚀 เริ่มภารกิจ</button></div>
 <div class="card"><h3>กติกา</h3><ul class="s"><li>แต่ละฐาน 10 คะแนน: สมมติฐาน 2 · หลักฐาน 3 · วิเคราะห์ 3 · ใช้ AI 2</li><li>ผ่านภารกิจเมื่อได้ ≥ 80% (60 คะแนน ต้องได้ 48) แก้คำตอบและตรวจซ้ำได้</li><li>ห้ามแต่งข้อมูล ทุกตัวเลขต้องมาจากการทดลองของทีม</li><li>คำใบ้เปิดได้หลังกรอกสมมติฐานและข้อมูลแล้ว</li></ul>
 <div class="note">⚠️ ข้อมูลเก็บไว้ในหน่วยความจำของหน้านี้เท่านั้น ปิดหรือรีเฟรชแล้วหาย และไม่ซิงก์ข้ามอุปกรณ์ ใช้ปุ่มส่งออก CSV เพื่อเก็บไว้</div></div>`);
}
function begin(){
 const t=$('#tm').value.trim();
 if(!t){$('#er').textContent='กรุณาตั้งชื่อทีมก่อน';return}
 if(!S.on.some(Boolean)){$('#er').textContent='เลือกอย่างน้อย 1 ฐาน';return}
 S.team=t;S.members=$('#mb').value.trim();map();
}
function map(){
 const n=S.on.filter(Boolean).length;
 go(`<div class="card"><h2>🗺️ แผนที่ภารกิจ</h2><p>เลือกฐานได้อิสระ หรือกด “โหมดหมุนเวียน” เพื่อไปตามลำดับ</p>
 <div class="fl"><button class="btn o" onclick="seq()">🔄 โหมดหมุนเวียน</button><button class="btn p" onclick="summary()">🏆 สรุปผล</button><button class="btn w" onclick="home()">⚙️ ตั้งค่า</button></div></div>
 <div class="grid">${ST.map((d,i)=>{if(!S.on[i])return'';const s=S.st[i],sc=s.checked?calc(i).t:0;const state=!s.checked?'ยังไม่ได้ตรวจ':sc>=8?'✅ ผ่าน':'🔁 ยังไม่ผ่าน';
 return `<button class="base" style="background:linear-gradient(180deg,${d.c},${d.c}cc)" onclick="mission(${i})"><div class="ic">${d.e}</div><h3>ฐาน ${i+1}: ${d.k}</h3><div>${d.n}</div><p style="margin:8px 0">🎯 ${d.prob}</p><span class="tag">${state}</span> <span class="tag">⭐ ${sc}/10</span></button>`}).join('')}</div>`);
}
function seq(){const i=S.st.findIndex((s,k)=>S.on[k]&&!(s.checked&&calc(k).t>=8));i<0?summary():mission(i)}
function nextOf(i){for(let k=i+1;k<6;k++)if(S.on[k])return k;return -1}

function mission(i){
 S.cur=i;const d=ST[i],s=S.st[i];
 const sim=d.sim?`<a class="btn g" style="display:inline-block;text-decoration:none" href="${d.sim.u}" target="_blank" rel="noopener">🔬 เปิด ${d.sim.t}</a>
 ${d.sim.v?'<p class="note warn" style="margin-top:8px">ลิงก์นี้ยังไม่ได้ตรวจสอบว่าตรงกับภารกิจ ครูควรเปิดดูก่อนใช้ ถ้าเปิดไม่ได้ให้ใช้การทดลองจริง</p>':''}
 <p style="font-size:.8rem">แหล่งอ้างอิง: ${d.sim.u}</p>${d.alt&&d.sim.v?`<p class="note">${d.alt}</p>`:''}`:
 `<div class="note warn"><b>🧪 การทดลองจริง (ไม่ใช่เว็บไซต์จำลอง)</b><br>${d.alt}</div>`;
 go(`<div class="card" style="border-color:${d.c}"><button class="btn w s" onclick="map()">← แผนที่</button>
 <h2 style="margin-top:10px">${d.e} ฐาน ${i+1}: ${d.k}</h2><div class="disp">${d.n}</div>
 <p>📖 ${d.story}</p><p>🌍 <b>สถานการณ์:</b> ${d.prob}</p><p>🤔 <b>คิดก่อนทดลอง:</b> ${d.q}</p></div>
 <div class="card"><h3>1) สมมติฐาน</h3><textarea rows="2" id="hyp" placeholder="ถ้า... แล้ว... เพราะ..." oninput="S.st[${i}].hyp=this.value">${esc(s.hyp)}</textarea></div>
 <div class="card"><h3>2) ทดลอง</h3>${sim}<ol class="s" style="margin-top:10px">${d.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>
 <div class="card"><h3>3) ตารางบันทึกผล</h3><div id="rows"></div>
 <div class="fl"><button class="btn s" onclick="addRow(${i})">➕ เพิ่มแถว</button><button class="btn s p" onclick="clr(${i})">🧹 ล้างข้อมูล</button><button class="btn s o" onclick="csv(${i})">📄 ส่งออก CSV</button></div><div id="csv"></div>
 <label>ข้อสังเกตและหลักฐาน (เช่น ภาพถ่าย สิ่งที่เห็น)</label><textarea rows="3" oninput="S.st[${i}].obs=this.value">${esc(s.obs)}</textarea></div>
 <div class="card"><h3>4) วิเคราะห์ผล</h3><p>${d.ans}</p><textarea rows="4" oninput="S.st[${i}].ans=this.value">${esc(s.ans)}</textarea></div>
 <div class="card"><h3>🤖 AI SCIENCE ASSISTANT</h3><div class="note">แอปนี้ไม่ได้เชื่อมต่อ AI คัดลอกพรอมต์ไปใช้ใน ChatGPT หรือ Claude เอง AI อาจตอบผิด ห้ามให้ AI สร้างตัวเลขผลทดลอง ต้องตรวจกับหลักฐานของทีมเสมอ</div>
 <div class="fl" style="margin:10px 0">${PROMPTS.map((p,k)=>`<button class="btn s w" onclick="cp(${i},${k})">📋 ${p[0]}</button>`).join('')}</div>
 <div class="fl"><a class="btn s" style="text-decoration:none" target="_blank" rel="noopener" href="https://chatgpt.com">เปิด ChatGPT</a><a class="btn s" style="text-decoration:none" target="_blank" rel="noopener" href="https://claude.ai">เปิด Claude</a></div>
 <p id="cpm" class="ok"></p><label>ทีมตรวจคำตอบ AI กับหลักฐานอย่างไร?</label><textarea rows="2" oninput="S.st[${i}].aiv=this.value">${esc(s.aiv)}</textarea></div>
 <div class="card"><h3>5) ตรวจคำตอบ</h3><div class="fl"><button class="btn g" onclick="chk(${i})">✅ ตรวจคำตอบและรับคะแนน</button><button class="btn o" onclick="hint(${i})">💡 คำใบ้</button></div><div id="res"></div></div>`);
 drawRows(i);if(s.checked)res(i);if(s.hint)hintShow(i);
}
function drawRows(i){
 const rs=S.st[i].rows;
 $('#rows').innerHTML=rs.length?rs.map((r,k)=>`<div class="row"><div class="fl" style="justify-content:space-between"><b>แถว ${k+1}</b><button class="btn s p" onclick="delRow(${i},${k})">🗑️ ลบ</button></div><div class="f">${COLS.map(c=>`<div><label>${c[1]}</label><input value="${esc(r[c[0]])}" oninput="S.st[${i}].rows[${k}].${c[0]}=this.value"></div>`).join('')}</div></div>`).join(''):'<p class="note">ยังไม่มีข้อมูล กด “เพิ่มแถว” แล้วกรอกจากการทดลองจริงของทีม</p>';
}
function addRow(i){S.st[i].rows.push(Object.fromEntries(COLS.map(c=>[c[0],''])));drawRows(i)}
function delRow(i,k){S.st[i].rows.splice(k,1);drawRows(i)}
function clr(i){if(confirm('ล้างตารางทั้งหมดของฐานนี้?')){S.st[i].rows=[];drawRows(i)}}
function csv(i){
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const t='\ufeff'+[COLS.map(c=>q(c[1])).join(',')].concat(S.st[i].rows.map(r=>COLS.map(c=>q(r[c[0]])).join(','))).join('\n');
 $('#csv').innerHTML=`<p class="note">คัดลอกข้อความนี้ไปวางใน Excel/Google Sheets (บันทึกเป็นไฟล์อัตโนมัติอาจใช้ไม่ได้บนหน้านี้)</p><textarea rows="4" readonly onclick="this.select()">${esc(t)}</textarea>`;
}
function cp(i,k){
 const t=PROMPTS[k][1].replace(/\{n\}/g,ST[i].n);
 const ok=()=>{S.st[i].aiCopied=true;$('#cpm').textContent='คัดลอกแล้ว นำไปวางใน AI ได้เลย'};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>fall(t,ok));else fall(t,ok);
}
function fall(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){prompt('คัดลอกพรอมต์นี้:',t)}a.remove()}
function hint(i){
 const s=S.st[i];
 if(!s.hyp.trim()||!s.rows.some(r=>r.data.trim())){$('#res').innerHTML='<p class="note warn">กรอกสมมติฐานและข้อมูลในตารางอย่างน้อย 1 แถวก่อน จึงจะเปิดคำใบ้ได้</p>';return}
 s.hint=true;hintShow(i);
}
function hintShow(i){$('#res').insertAdjacentHTML('afterbegin',`<div class="note">💡 ${ST[i].hint}</div>`)}
function chk(i){const s=S.st[i];const r=calc(i);s.checked=true;s.fb=r.fb;top();$('#res').innerHTML='';res(i);if(s.hint)hintShow(i)}
function res(i){
 const r=calc(i),n=nextOf(i),p=r.t>=8;
 $('#res').insertAdjacentHTML('beforeend',`<div class="note ${p?'':'warn'}" style="margin-top:12px"><div class="stars">${'⭐'.repeat(Math.round(r.t/2))}</div><b>${r.t} / 10 คะแนน · ${p?'ผ่านฐานนี้':'ยังไม่ผ่าน (ต้อง ≥ 8)'}</b>
 ${r.fb.length?'<ul class="s">'+r.fb.map(x=>`<li>${x}</li>`).join('')+'</ul>':'<p class="ok">ครบทุกเกณฑ์!</p>'}
 <p style="font-size:.8rem">คะแนนอัตโนมัติวัดความครบถ้วนของงาน ไม่ได้ตัดสินความถูกต้องของข้อสรุป ครูควรตรวจเนื้อหาร่วมด้วย</p>
 <div class="fl"><button class="btn s w" onclick="map()">แผนที่</button>${n>=0?`<button class="btn s" onclick="mission(${n})">ฐานถัดไป →</button>`:`<button class="btn s p" onclick="summary()">🏆 สรุปผล</button>`}</div></div>`);
}
function summary(){
 const t=total(),m=max(),ok=t>=pass();
 go(`<div class="card hero"><div style="font-size:4rem">${ok?'🏆':'🚀'}</div><h1 class="title" style="font-size:2rem">${ok?'ภารกิจสำเร็จ!':'ยังไปต่อได้'}</h1>
 <p class="disp" style="font-size:1.4rem">${esc(S.team)}: ${t} / ${m} คะแนน</p><p>เกณฑ์ผ่าน ${pass()} คะแนน${S.members?'<br>สมาชิก: '+esc(S.members):''}</p>
 <div class="bar"><i style="width:${m?t/m*100:0}%"></i></div></div>
 <div class="card"><h3>ผลแต่ละฐาน</h3>${ST.map((d,i)=>{if(!S.on[i])return'';const s=S.st[i],sc=s.checked?calc(i).t:0;return `<div class="fl" style="justify-content:space-between;padding:6px 0;border-bottom:2px dashed #cfe0ff"><span>${d.e} ${d.n}</span><span>${s.checked?(sc>=8?'🏅 ':'🔁 ')+sc+'/10':'ยังไม่ได้ตรวจ'}</span></div>`}).join('')}</div>
 <div class="card"><h3>ข้อเสนอแนะ</h3><ul class="s">${suggest().map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <div class="fl"><button class="btn" onclick="map()">กลับแผนที่</button><button class="btn p" onclick="if(confirm('เริ่มใหม่ทั้งหมด? ข้อมูลจะหาย')){location.reload()}">เริ่มใหม่</button></div>`);
}
function suggest(){
 const o=[];let a=0,b=0,c=0,e=0,n=0;
 S.st.forEach((s,i)=>{if(!S.on[i]||!s.checked)return;n++;const sc=calc(i);const x=sc.fb.join('|');if(x.includes('สมมติฐาน'))a++;if(x.includes('หลักฐาน'))b++;if(x.includes('วิเคราะห์'))c++;if(x.includes('AI'))e++});
 if(!n)return['ยังไม่ได้ตรวจฐานใดเลย ลองเริ่มจากฐานที่สนใจ'];
 if(a)o.push('ฝึกเขียนสมมติฐานแบบ “ถ้า...แล้ว...” ให้ชัดเจน');
 if(b)o.push('บันทึกข้อมูลพร้อมหน่วยให้ครบตามจำนวนเงื่อนไขที่กำหนด');
 if(c)o.push('อธิบายเหตุผลโดยอ้างข้อมูลของทีม และเขียนข้อสรุปในตาราง');
 if(e)o.push('ใช้ AI แล้วตรวจกับหลักฐานเสมอ และบันทึกวิธีตรวจ');
 if(!o.length)o.push('ทีมทำได้ครบทุกเกณฑ์ ลองตั้งคำถามต่อยอดและทดลองเพิ่ม');
 return o;
}
home();
</script>
</body>
</html>
